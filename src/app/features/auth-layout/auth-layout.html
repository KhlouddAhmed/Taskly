<div class="min-h-screen bg-[--color-background]">

  <!-- Desktop Sidebar -->
  <app-sidebar />

  <!-- Mobile Drawer -->
  <app-mobile-drawer
    [isOpen]="isDrawerOpen()"
    (close)="closeDrawer()" />

  <!-- Navbar — passes openDrawer fn -->
  <app-navbar [onMenuToggle]="openDrawer.bind(this)" />

  <!-- Main Content -->
  <main class="pt-16 pb-16 lg:pb-0 lg:pl-64 transition-all duration-300">
    <router-outlet />
  </main>

  <!-- Mobile Bottom Nav -->
  <app-bottom-nav />

</div>
