<div class="min-h-screen bg-[#F9F9FF] text-[#041B3C]">

  <!-- Top Navbar -->
  <app-navbar [onMenuToggle]="openDrawer.bind(this)" />

  <!-- Desktop Sidebar -->
  <app-sidebar />

  <!-- Mobile Drawer -->
  @if (isDrawerOpen()) {
    <app-mobile-drawer
      [isOpen]="isDrawerOpen()"
      (close)="closeDrawer()" />
  }

  <!-- Main Content View Area -->
  <main class="min-h-screen pt-16 pb-20 md:pb-8 px-4 sm:px-6 lg:px-8 lg:pl-64 transition-all duration-300">
    <div class="mx-auto max-w-7xl pt-4">
      <router-outlet />
    </div>
  </main>

  <!-- Mobile Bottom Navigation (يظهر فقط للشاشات الأصغر من 768px - أحجام الموبايل) -->
  <div class="fixed bottom-0 left-0 right-0 z-30 md:hidden">
    <app-bottom-nav />
  </div>

</div>
