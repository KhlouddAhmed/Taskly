<nav class="flex h-16 w-full items-center justify-around border-t border-black/10 bg-[#F1F3FF] px-2 shadow-sm">
  @for (item of items; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="active-bottom-link"
      class="flex flex-col items-center justify-center gap-1 text-[11px] font-medium text-[#041B3C]/70 transition-colors">
      <img [src]="item.icon" [alt]="item.label" class="nav-icon h-5 w-5" />
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
