<!-- Backdrop -->
@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/40 lg:hidden"
    (click)="close.emit()">
  </div>
}

<!-- Drawer -->
<div
  [class]="isOpen()
    ? 'fixed top-0 bottom-0 left-0 z-50 flex w-full flex-col bg-white transition-transform duration-300 translate-x-0 lg:hidden'
    : 'fixed top-0 bottom-0 left-0 z-50 flex w-full flex-col bg-white transition-transform duration-300 -translate-x-full lg:hidden'">

  <!-- Header -->
  <div class="flex h-16 items-center justify-between border-b border-[--color-slate-light] px-4">
    <div class="flex items-center gap-2">
      <img src="icons/taskly-icon.svg" alt="Taskly" class="h-6 w-6" />
      <span class="text-base font-bold tracking-widest text-[--color-slate-darkest]">TASKLY</span>
    </div>
    <button (click)="close.emit()" class="p-1 text-[--color-slate-mid]">
      <img src="icons/close.svg" alt="close" class="h-5 w-5" />
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex flex-col gap-1 p-4">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        (click)="close.emit()"
        class="nav-link flex items-center gap-3 rounded-md px-3 py-2 text-sm transition hover:bg-[--color-surface-low]">
        <img [src]="item.icon" [alt]="item.label" class="nav-icon h-5 w-5 shrink-0" />
        <span class="nav-label text-[--color-slate-darkest]">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Divider -->
  <div class="mx-4 border-t border-[--color-slate-light]"></div>

  <!-- Project Accordion -->
  <div class="flex flex-col gap-1 p-4">

    <!-- Accordion Header -->
    <button
      (click)="toggleProject()"
      [class]="isProjectOpen
        ? 'flex w-full items-center justify-between rounded-md bg-[--color-surface-highest] px-3 py-2 text-sm font-medium text-[--color-slate-darkest]'
        : 'flex w-full items-center justify-between rounded-md bg-white border border-[--color-slate-light] px-3 py-2 text-sm font-medium text-[--color-slate-darkest]'">
      <div class="flex items-center gap-3">
        <img src="icons/projects.svg" alt="project" class="h-5 w-5 shrink-0" />
        <span class="max-w-[200px] truncate">Active Project Na...</span>
      </div>
      <img
        src="icons/arrow-up.svg"
        alt="toggle"
        [class]="isProjectOpen
          ? 'h-4 w-4 transition-transform duration-200'
          : 'h-4 w-4 rotate-180 transition-transform duration-200'" />
    </button>

    <!-- Accordion Body -->
    @if (isProjectOpen) {
      <div class="flex flex-col rounded-md bg-white">
        @for (link of projectLinks; track link.route) {
          <a
            [routerLink]="link.route"
            routerLinkActive="bg-[--color-surface-low]"
            (click)="close.emit()"
            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-[--color-slate-darkest] transition hover:bg-[--color-surface-low]">
            <img [src]="link.icon" [alt]="link.label" class="h-5 w-5 shrink-0" />
            <span>{{ link.label }}</span>
          </a>
        }
      </div>
    }

  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Logout -->
  <div class="border-t border-[--color-slate-light] p-4">
    <button
      (click)="performLogout()"
      [disabled]="isLoggingOut()"
      class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-[--color-error] transition hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50">
      <img src="icons/log-out.svg" alt="logout" class="h-5 w-5 shrink-0" />
      <span>{{ isLoggingOut() ? 'Logging out...' : 'Logout' }}</span>
    </button>
  </div>

</div>
