@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/40 lg:hidden"
    (click)="close.emit()">
  </div>
}

<!-- drawer container -->
<div
  [class]="isOpen()
    ? 'fixed top-0 bottom-0 left-0 z-50 flex w-full flex-col bg-background p-4 transition-transform duration-300 translate-x-0 lg:hidden'
    : 'fixed top-0 bottom-0 left-0 z-50 flex w-full flex-col bg-background p-4 transition-transform duration-300 -translate-x-full lg:hidden'">

  <!-- header -->
  <div class="flex h-12 items-center justify-between px-1">
    <div class="flex items-center gap-2">
      <img src="icons/taskly-icon.svg" alt="Taskly" class="h-6 w-6" />
      <span class="text-base font-bold tracking-widest text-[--color-slate-darkest]">TASKLY</span>
    </div>
    <button (click)="close.emit()" class="p-1 text-[--color-slate-mid] hover:opacity-75">
      <img src="icons/close.svg" alt="close" class="h-5 w-5" />
    </button>
  </div>

  <!-- nav links -->
  <nav class="mt-4 flex flex-col gap-1.5">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        (click)="close.emit()"
        class="nav-link flex items-center gap-3 rounded-xl px-4 py-3 
        text-sm font-medium text-[--color-slate-darkest] transition hover:bg-white/60">
        <img [src]="item.icon" [alt]="item.label" class="nav-icon h-5 w-5 shrink-0" />
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="my-3 mx-2 border-t border-[--color-slate-light]"></div>

  <!-- active project list -->
  <div class="rounded-2xl bg-[--color-surface-highest] p-2.5">
    
    <!-- list button -->
    <button
      (click)="toggleProject()"
      class="flex w-full items-center justify-between px-2 py-1.5 
      text-sm font-bold text-[--color-slate-darkest]">
      <div class="flex items-center gap-3">
        <img src="icons/projects.svg" alt="project" class="h-5 w-5 shrink-0" />
        <span class="max-w-50 truncate">Active Project Na...</span>
      </div>
      <img
        src="icons/arrow-up.svg"
        alt="toggle"
        [class]="isProjectOpen
          ? 'h-4 w-4 transition-transform duration-200'
          : 'h-4 w-4 rotate-180 transition-transform duration-200'" />
    </button>

    <!-- nested container -->
    @if (isProjectOpen) {
      <div class="mt-2 flex flex-col gap-1 rounded-xl bg-white p-2 shadow-xs">
        @for (link of projectLinks; track link.route) {
          <a
            [routerLink]="link.route"
            routerLinkActive="bg-[--color-surface-low] font-semibold"
            (click)="close.emit()"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm 
            text-[--color-slate-darkest] transition hover:bg-[--color-surface-low]">
            <img [src]="link.icon" [alt]="link.label" class="h-4 w-4 shrink-0" />
            <span>{{ link.label }}</span>
          </a>
        }
      </div>
    }

  </div>

  <!-- space -->
  <div class="flex-1"></div>

  <!-- logout -->
  <div class="border-t border-[--color-slate-light] pt-4">
    <button
      (click)="performLogout()"
      [disabled]="isLoggingOut()"
      class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm 
      font-semibold text-[--color-error] transition hover:bg-red-50 
      disabled:cursor-not-allowed disabled:opacity-50">
      <img src="icons/log-out.svg" alt="logout" class="h-5 w-5 shrink-0" />
      <span>{{ isLoggingOut() ? 'Logging out...' : 'Logout' }}</span>
    </button>
  </div>

</div>
