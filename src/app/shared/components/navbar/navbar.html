<header class="fixed top-0 right-0 left-0 z-30 flex h-16 items-center justify-between border-b
 border-black/10 bg-[#F9F9FF] px-6 transition-all duration-300 lg:left-64">

  <!-- mobile burger + logo -->
  <div class="flex items-center gap-3 lg:hidden">
    <button (click)="onMenuToggle()!()" class="p-1 text-[#041B3C]" aria-label="Open menu">
      <img src="icons/burger.svg" alt="menu" class="h-6 w-6" />
    </button>
    <div class="flex items-center gap-2">
      <img src="taskly-icon.svg" alt="Taskly logo" width="18" height="20" />
      <span class="logo-text">TASKLY</span>
    </div>
  </div>

  <!-- desktop: empty left space (sidebar covers left side) -->
  <div class="hidden lg:block"></div>

  <!-- rightsid: user info -->
  <div class="flex items-center gap-4">
    @if (store.isLoading()) {
      <div class="h-10 w-36 animate-pulse rounded-lg bg-gray-200"></div>
    } @else if (store.error()) {
      <span class="text-xs text-[#BA1A1A]">Failed to load</span> 
    } @else {
      <!-- name + title -->
      <div class="hidden flex-col items-end md:flex">
        <span class="text-sm font-semibold leading-5 text-[#041B3C]">{{ store.fullName() }}</span>
        <span class="text-[10px] font-bold leading-5 tracking-[1px] uppercase text-[#003D9B]">
          {{ store.jobTitle() }}
        </span>
      </div>

      <!-- usericon box  -->
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#0052CC] 
      text-base font-bold text-white shadow-[0px_1px_2px_rgba(0,0,0,0.05)]">
        {{ store.initials() }}
      </div>
    }
  </div>

</header>
